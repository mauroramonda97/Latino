    function normalizeStr(str) {
      if (!str) return '';
      return str.toLowerCase().trim().replace(/[’']/g, "'").replace(/\s+/g, ' ');
    }

    function normalizeLatinStrict(str) {
      if (!str) return '';
      return str.toLowerCase().trim()
        .replace(/[ăā]/g, 'a').replace(/[ĕē]/g, 'e').replace(/[ĭī]/g, 'i')
        .replace(/[ŏō]/g, 'o').replace(/[ŭū]/g, 'u').replace(/\s+/g, ' ');
    }

      }, [timerRunning, adShownOnce]);

      const checkEx1Field = (nounKey, rowIndex, numKey) => {
        const userVal = normalizeLatinStrict(ex1Inputs[nounKey][rowIndex][numKey]);
        const expected = normalizeLatinStrict(EX1_DATA[nounKey].rows[rowIndex][numKey]);
        return userVal !== '' && userVal === expected;
      };

      const checkEx2Item = (item) => {
        const u = ex2Inputs[item.id] || {};
        const userTrad = normalizeStr(u.traduzione || '');
        const tradOk = userTrad.length > 0 && item.acceptedTraduzioni.some((t) => normalizeStr(t) === userTrad);

        if (item.categoria === 'verbo') {
          const modoOk = u.modo === item.modo;
          const tempoOk = u.tempo === item.tempo;
          const diatesiOk = u.diatesi === item.diatesi;
          const personaOk = u.persona === item.persona;
          const analisiOk = modoOk && tempoOk && diatesiOk && personaOk;
          const paradigmaChecks = item.paradigma.map((expectedForm, pIdx) => {
            const userForm = normalizeLatinStrict((u.paradigma && u.paradigma[pIdx]) || '');
            if (pIdx === 3 && item.supinoAssente) {
              return ['', '-', '—', '--', 'manca', 'assente', 'no'].includes(userForm);
            }
            return userForm !== '' && userForm === normalizeLatinStrict(expectedForm);
          });
          return { modoOk, tempoOk, diatesiOk, personaOk, analisiOk, paradigmaChecks, paradigmaOk: paradigmaChecks.every(Boolean), tradOk };
        }
        if (item.categoria === 'congiunzione') {
          const tipoCongOk = u.tipoCong === item.tipoCong;
          return { tipoCongOk, analisiOk: tipoCongOk, tradOk };
        }
        if (item.categoria === 'nome') {
          const casoOk = u.caso === item.caso;
          const genereOk = u.genere === item.genere;
          const numeroOk = u.numero === item.numero;
          return { casoOk, genereOk, numeroOk, analisiOk: casoOk && genereOk && numeroOk, tradOk };
        }
        return { analisiOk: true, tradOk };
      };

      const checkEx3Item = (item) => {
        const userVal = normalizeLatinStrict(ex3Inputs[item.id] || '');
        return userVal !== '' && item.accepted.some((a) => normalizeLatinStrict(a) === userVal);
      };

      const checkEx4Cell = (verbo, tIdx) => {
        const userLat = normalizeLatinStrict(ex4Inputs[verbo.id][tIdx]?.latino || '');
        const userTrad = normalizeStr(ex4Inputs[verbo.id][tIdx]?.traduzione || '');
        const tempoObj = verbo.tempi[tIdx];
        const latOk = userLat !== '' && tempoObj.acceptedLatino.some((a) => normalizeLatinStrict(a) === userLat);
        const tradOk = userTrad !== '' && tempoObj.acceptedTraduzione.some((a) => normalizeStr(a) === userTrad);
        return { latOk, tradOk };
      };

      const checkEx5Token = (tok) => {
        const chosen = ex5Selections[tok.id] || '';
        return chosen !== '' && chosen === tok.correct;
      };

      const checkEx6Item = (item) => {
        const u = ex6Inputs[item.id];
        return {
          fenOk: item.acceptedFenomeno.includes(normalizeStr(u.fenomeno)),
          prefOk: normalizeLatinStrict(u.prefisso) === normalizeLatinStrict(item.prefisso),
          baseOk: normalizeLatinStrict(u.verboBase) === normalizeLatinStrict(item.verboBase),
          compOk: normalizeLatinStrict(u.composto) === normalizeLatinStrict(item.composto)
        };
      };

      const scores = useMemo(() => {
        let ex1Correct = 0;
        ['legatus', 'virus'].forEach((n) => {
          for (let i = 0; i < 6; i++) {
            if (checkEx1Field(n, i, 'sing')) ex1Correct++;
            if (checkEx1Field(n, i, 'plur')) ex1Correct++;
          }
        });

        let ex2Correct = 0, ex2Max = 0;
        EX2_DATA.forEach((item) => {
          const res = checkEx2Item(item);
          if (item.categoria === 'verbo') {
            ex2Max += 10;
            if (res.modoOk) ex2Correct++;
            if (res.tempoOk) ex2Correct++;
            if (res.diatesiOk) ex2Correct++;
            if (res.personaOk) ex2Correct++;
            res.paradigmaChecks.forEach((ok) => { if (ok) ex2Correct++; });
            if (res.tradOk) ex2Correct++;
          } else if (item.categoria === 'congiunzione') {
            ex2Max += 2;
            if (res.tipoCongOk) ex2Correct++;
            if (res.tradOk) ex2Correct++;
          } else if (item.categoria === 'nome') {
            ex2Max += 4;
            if (res.casoOk) ex2Correct++;
            if (res.genereOk) ex2Correct++;
            if (res.numeroOk) ex2Correct++;
            if (res.tradOk) ex2Correct++;
          } else {
            ex2Max += 1;
            if (res.tradOk) ex2Correct++;
          }
        });

        let ex3Correct = 0;
        EX3_DATA.forEach((item) => { if (checkEx3Item(item)) ex3Correct++; });

        let ex4Correct = 0;
        EX4_DATA.forEach((v) => {
          v.tempi.forEach((_, idx) => {
            const { latOk, tradOk } = checkEx4Cell(v, idx);
            if (latOk) ex4Correct++;
            if (tradOk) ex4Correct++;
          });
        });

        let ex5Correct = 0;
        EX5_DATA.tokens.forEach((tok) => { if (checkEx5Token(tok)) ex5Correct++; });
        const ex5Max = EX5_DATA.tokens.length;

        let ex6Correct = 0;
        EX6_DATA.forEach((item) => {
          const { fenOk, prefOk, baseOk, compOk } = checkEx6Item(item);
          if (fenOk) ex6Correct++;
          if (prefOk) ex6Correct++;
          if (baseOk) ex6Correct++;
          if (compOk) ex6Correct++;
        });

        const totalCorrect = ex1Correct + ex2Correct + ex3Correct + ex4Correct + ex5Correct + ex6Correct;
        const totalMax = 24 + ex2Max + 10 + 18 + ex5Max + 12;

        return {
          ex1: { correct: ex1Correct, max: 24 },
          ex2: { correct: ex2Correct, max: ex2Max },
          ex3: { correct: ex3Correct, max: 10 },
          ex4: { correct: ex4Correct, max: 18 },
          ex5: { correct: ex5Correct, max: ex5Max },
          ex6: { correct: ex6Correct, max: 12 },
          totalCorrect,
          totalMax,
          percent: Math.round((totalCorrect / totalMax) * 100)
        };
      }, [ex1Inputs, ex2Inputs, ex3Inputs, ex4Inputs, ex5Selections, ex6Inputs]);

      const handleFinalSubmit = async () => {
        const conferma = window.confirm(
          `Vuoi consegnare definitivamente la verifica a nome di ${studentName.trim()} ${studentSurname.trim()}?\n\nVerranno corretti tutti gli esercizi e il punteggio sarà registrato.`
        );
        if (!conferma) return;

        setEx1Checked(true);
        setEx2Checked(true);
        setEx3Checked(true);
        setEx4Checked(true);
        setEx5Checked(true);
        setEx6Checked(true);
        setTimerRunning(false);
        setIsSubmitting(true);
        setSubmitError('');

        const payload = {
          nome: studentName.trim(),
          cognome: studentSurname.trim(),
          punteggio: `${scores.totalCorrect} / ${scores.totalMax}`,
          percentuale: `${scores.percent}%`,
          tempo: formatDuration(elapsedSeconds)
        };

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSubmittedSuccess(true);
        } catch (err) {
          setSubmitError('Si è verificato un problema durante l’invio. Riprova tra qualche secondo.');
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleEx1Change = (nounKey, rowIdx, numKey, val) => {
        setEx1Inputs((prev) => ({
          ...prev,
          [nounKey]: prev[nounKey].map((row, idx) => (idx === rowIdx ? { ...row, [numKey]: val } : row))
        }));
      };

      const resetEx1 = () => { setEx1Inputs({ legatus: Array(6).fill({ sing: '', plur: '' }), virus: Array(6).fill({ sing: '', plur: '' }) }); setEx1Checked(false); };
      const resetEx2 = () => { setEx2Inputs(createInitialEx2State()); setEx2Checked(false); };
      const resetEx3 = () => { const empty = {}; EX3_DATA.forEach((item) => { empty[item.id] = ''; }); setEx3Inputs(empty); setEx3Checked(false); };
      const resetEx4 = () => { const empty = {}; EX4_DATA.forEach((v) => { empty[v.id] = v.tempi.map(() => ({ latino: '', traduzione: '' })); }); setEx4Inputs(empty); setEx4Checked(false); };
      const resetEx5 = () => { setEx5Selections(createInitialEx5State()); setEx5Checked(false); };
      const resetEx6 = () => { const empty = {}; EX6_DATA.forEach((item) => { empty[item.id] = { fenomeno: '', prefisso: '', verboBase: '', composto: '', spiegazione: '' }; }); setEx6Inputs(empty); setEx6Checked(false); };

      const TABS = [
        { id: 'ex1', label: 'Es. 1', title: 'Declinazioni', score: scores.ex1, checked: ex1Checked },
        { id: 'ex2', label: 'Es. 2', title: 'Analisi & Trad.', score: scores.ex2, checked: ex2Checked },
        { id: 'ex3', label: 'Es. 3', title: 'Italiano → Latino', score: scores.ex3, checked: ex3Checked },
        { id: 'ex4', label: 'Es. 4', title: 'Tempi Indicativo', score: scores.ex4, checked: ex4Checked },
        { id: 'ex5', label: 'Es. 5', title: 'Versione', score: scores.ex5, checked: ex5Checked },
        { id: 'ex6', label: 'Es. 6', title: 'Verbi Composti', score: scores.ex6, checked: ex6Checked }
      ];

      const currentTabIndex = TABS.findIndex((t) => t.id === activeTab);
      const goNextTab = () => { if (currentTabIndex < TABS.length - 1) setActiveTab(TABS[currentTabIndex + 1].id); };
      const goPrevTab = () => { if (currentTabIndex > 0) setActiveTab(TABS[currentTabIndex - 1].id); };

      if (!quizStarted) {
        return (
          <div className="min-h-screen bg-[#FAF8F5] text-stone-800 flex items-center justify-center p-4">
            <div className="max-w-md w-full bg-white rounded-2xl shadow-lg border border-stone-200 overflow-hidden">
              <div className="bg-gradient-to-r from-[#6E1D29] via-[#8B2635] to-[#74202D] text-amber-50 p-6 border-b-4 border-[#B4833E]">
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-amber-50/10 rounded-xl border border-amber-200/25">
                    <Icon name="scroll-text" className="w-6 h-6 text-amber-200" />
                  </div>
                  <div>
                    <div className="text-[11px] uppercase tracking-widest text-amber-200/90 font-semibold">
                      Lingua Latina • Verifica Interattiva
                    </div>
                    <h1 className="text-xl font-serif font-bold text-white">
                      Esercitazione Completa di Latino
                    </h1>
                  </div>
                </div>
              </div>

              <form onSubmit={handleStartQuiz} className="p-6 space-y-4">
                <p className="text-sm text-stone-600 leading-relaxed">
                  Inserisci i tuoi dati per iniziare la verifica. Al termine potrai inviare il risultato finale al docente.
                </p>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1.5">Nome *</label>
                  <input
                    type="text"
                    value={studentName}
                    onChange={(e) => setStudentName(e.target.value)}
                    placeholder="Es. Marco"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm font-medium outline-none focus:border-[#8B2635] focus:ring-2 focus:ring-[#8B2635]/15"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1.5">Cognome *</label>
                  <input
                    type="text"
                    value={studentSurname}
                    onChange={(e) => setStudentSurname(e.target.value)}
                    placeholder="Es. Rossi"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm font-medium outline-none focus:border-[#8B2635] focus:ring-2 focus:ring-[#8B2635]/15"
                  />
                </div>

                {nameError && (
                  <div className="text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 px-3 py-2 rounded-lg">
                    {nameError}
                  </div>
                )}

                <button
                  type="submit"
                  className="w-full py-3 rounded-xl bg-[#8B2635] hover:bg-[#741F2B] text-white text-sm font-semibold shadow-sm transition flex items-center justify-center gap-2 mt-2"
                >
                  <span>Inizia la verifica</span>
                  <Icon name="chevron-right" className="w-4 h-4" />
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#FAF8F5] text-stone-800 font-sans selection:bg-[#8B2635]/15 selection:text-[#8B2635]">
          {showAdPopup && (
            <div className="pop-overlay fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-xs p-3 sm:p-4" onClick={() => setShowAdPopup(false)}>
              <div onClick={(e) => e.stopPropagation()} className="pop-card relative max-w-2xl w-full max-h-[92dvh] flex flex-col bg-white rounded-2xl shadow-2xl overflow-hidden border-2 border-amber-400">
                <div className="shrink-0 bg-stone-900 text-amber-200 px-3 sm:px-4 py-2.5 flex items-center justify-between gap-2 text-[11px] sm:text-xs font-semibold uppercase tracking-wider">
                  <span className="truncate">Messaggio promozionale • Pausa di studio</span>
                  <button
                    onClick={() => setShowAdPopup(false)}
                    aria-label="Chiudi"
                    className="shrink-0 inline-flex items-center gap-1 px-3 py-2 sm:px-2.5 sm:py-1 rounded-lg bg-white/15 hover:bg-white/25 active:bg-white/30 text-white transition"
                  >
                    <span>Chiudi</span>
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="relative bg-blue-950 flex-1 min-h-0 overflow-y-auto flex items-center justify-center">
                  <img

          {/* HEADER */}
          <header className="bg-gradient-to-r from-[#6E1D29] via-[#8B2635] to-[#74202D] text-amber-50 shadow-md border-b-4 border-[#B4833E]">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-6">
              <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                <div className="flex items-start sm:items-center gap-3.5">
                  <div className="p-3 bg-amber-50/10 rounded-xl border border-amber-200/25 shrink-0">
                    <Icon name="scroll-text" className="w-7 h-7 text-amber-200" />
                  </div>
                  <div>
                    <div className="flex flex-wrap items-center gap-2 text-xs uppercase tracking-widest text-amber-200/90 font-semibold">
                      <span>Lingua Latina • Verifica Interattiva</span>
                      <span className="bg-white/15 text-white px-2 py-0.5 rounded normal-case tracking-normal flex items-center gap-1">
                        <Icon name="user-check" className="w-3.5 h-3.5 text-amber-300" />
                        {studentName} {studentSurname}
                      </span>
                    </div>
                    <h1 className="text-xl sm:text-2xl md:text-3xl font-serif font-bold tracking-tight text-white mt-0.5">
                      Esercitazione Completa di Latino
                    </h1>
                    <p className="text-xs sm:text-sm text-amber-100/85 mt-1">
                      Declinazioni, analisi grammaticale, forme verbali, traduzione e fonetica dei verbi composti
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  <div className="bg-black/25 backdrop-blur-sm rounded-xl px-3.5 py-2.5 border border-amber-200/20 flex items-center gap-2.5">
                    <Icon name="clock" className="w-4 h-4 text-amber-300" />
                    <div>
                      <div className="text-[10px] uppercase tracking-wider text-amber-200/80 font-semibold">Tempo trascorso</div>
                      <div className="font-mono font-bold text-base text-white leading-tight">{formatDuration(elapsedSeconds)}</div>
                    </div>
                  </div>

                  <div className="bg-black/25 backdrop-blur-sm rounded-xl p-3 border border-amber-200/20 min-w-[190px]">
                    <div className="flex items-center justify-between text-xs font-medium text-amber-100 mb-1.5">
                      <span className="flex items-center gap-1.5">
                        <Icon name="award" className="w-4 h-4 text-amber-300" />
                        Punteggio
                      </span>
                      <span className="font-bold text-white">{scores.totalCorrect} / {scores.totalMax} ({scores.percent}%)</span>
                    </div>
                    <div className="w-full h-2 bg-black/30 rounded-full overflow-hidden">
                      <div className="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-500 rounded-full" style={{ width: `${scores.percent}%` }} />
                    </div>
                  </div>

                  {!submittedSuccess ? (
                    <button
                      onClick={handleFinalSubmit}
                      disabled={isSubmitting}
                      className="inline-flex items-center gap-2 px-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-md transition disabled:opacity-60"
                    >
                      <Icon name="send" className="w-4 h-4" />
                      <span>{isSubmitting ? 'Invio...' : 'Consegna verifica'}</span>
                    </button>
                  ) : (
                    <div className="inline-flex items-center gap-1.5 px-4 py-3 rounded-xl bg-emerald-900/80 border border-emerald-400/50 text-emerald-100 text-xs font-bold">
                      <Icon name="check-circle-2" className="w-4 h-4 text-emerald-300" />
                      <span>Risultato registrato!</span>
                    </div>
                  )}
                </div>
              </div>

              {submittedSuccess && (
                <div className="mt-4 rounded-xl bg-emerald-900/70 border border-emerald-400/40 px-4 py-3 text-xs sm:text-sm text-emerald-50">
                  Ottimo lavoro, <strong>{studentName} {studentSurname}</strong>! Il tuo punteggio finale di{' '}
                  <strong>{scores.totalCorrect}/{scores.totalMax} ({scores.percent}%)</strong> in{' '}
                  <strong>{formatDuration(elapsedSeconds)}</strong> è stato inviato al docente. Puoi ora rivedere le correzioni in ogni scheda.
                </div>
              )}

              {submitError && (
                <div className="mt-4 rounded-xl bg-rose-900/80 border border-rose-400/40 px-4 py-3 text-xs sm:text-sm text-rose-100">
                  {submitError}
                </div>
              )}
            </div>
          </header>

          {/* NAVIGAZIONE A SCHEDE */}

            <div className="max-w-6xl mx-auto px-3 sm:px-6">
              <div className="flex items-center gap-1.5 py-2.5 overflow-x-auto no-scrollbar">
                {TABS.map((tab) => {
                  const isActive = activeTab === tab.id;
                  const isComplete = tab.checked && tab.score && tab.score.correct === tab.score.max;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition-all ${
                        isActive ? 'bg-[#8B2635] text-white shadow-sm' : 'bg-white/80 text-stone-700 hover:bg-white hover:text-[#8B2635] border border-stone-200/80'
                      }`}
                    >
                      <span className="font-bold">{tab.label}</span>
                      <span className={`hidden sm:inline text-xs ${isActive ? 'text-amber-100' : 'text-stone-500'}`}>{tab.title}</span>
                      {tab.score && tab.checked && (
                        <span className={`text-xs px-1.5 py-0.5 rounded-full font-semibold ${isActive ? 'bg-white/20 text-white' : isComplete ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-600'}`}>
                          {tab.score.correct}/{tab.score.max}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </nav>

          {/* CONTENUTO PRINCIPALE */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {/* ESERCIZIO 1 */}
            {activeTab === 'ex1' && (
              <section className="space-y-6">
                <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-5 sm:p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-stone-100 pb-4">
                    <div>
                      <span className="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#8B2635] bg-[#8B2635]/10 px-2.5 py-1 rounded-md">Esercizio 1</span>
                      <h2 className="text-xl sm:text-2xl font-serif font-bold text-stone-900 mt-1.5">
                        Declina per intero <span className="text-[#8B2635]">LEGATUS, I</span> e <span className="text-[#8B2635]">VIRUS, I</span>
                      </h2>
                      <p className="text-sm text-stone-600 mt-1">Completa tutti i casi al singolare e al plurale per entrambi i sostantivi della II declinazione.</p>

                        <Icon name="check-circle-2" className="w-4 h-4" /> Verifica

                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                    {(['legatus', 'virus']).map((nounKey) => {
                      const noun = EX1_DATA[nounKey];
                      return (
                        <div key={nounKey} className="rounded-xl border border-stone-200 bg-[#FAF8F5] overflow-hidden shadow-xs">
                          <div className="bg-stone-800 text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2">
                            <div>
                              <h3 className="font-serif font-bold text-lg text-amber-200">{noun.lemma}</h3>
                              <p className="text-xs text-stone-300">{noun.info}</p>
                            </div>
                            <span className="text-xs bg-white/10 px-2.5 py-1 rounded-md text-amber-100">Significato: <strong>{noun.significato}</strong></span>
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                              <thead>
                                <tr className="bg-stone-200/70 text-stone-700 border-b border-stone-200">
                                  <th className="py-2.5 px-3 text-left font-semibold w-1/3">Caso</th>
                                  <th className="py-2.5 px-3 text-left font-semibold w-1/3">Singolare</th>
                                  <th className="py-2.5 px-3 text-left font-semibold w-1/3">Plurale</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-stone-200/80 bg-white">
                                {noun.rows.map((row, idx) => {
                                  const singOk = checkEx1Field(nounKey, idx, 'sing');
                                  const plurOk = checkEx1Field(nounKey, idx, 'plur');
                                  return (
                                    <tr key={row.caso} className="hover:bg-stone-50/80">
                                      <td className="py-2.5 px-3 font-medium text-stone-700">{row.caso}</td>
                                      <td className="py-2 px-2.5">
                                        <input
                                          type="text"
                                          value={ex1Inputs[nounKey][idx].sing}
                                          onChange={(e) => handleEx1Change(nounKey, idx, 'sing', e.target.value)}
                                          className={`w-full px-2.5 py-1.5 rounded-lg border text-sm font-medium outline-none transition ${!ex1Checked ? 'border-stone-300 focus:border-[#8B2635]' : singOk ? 'border-emerald-500 bg-emerald-50/70 text-emerald-900' : 'border-rose-400 bg-rose-50/70 text-rose-900'}`}
                                        />
                                        {ex1Checked && !singOk && <div className="text-[11px] font-semibold text-rose-700 mt-0.5">Corretto: <span className="underline">{row.sing}</span></div>}

                                      <td className="py-2 px-2.5">
                                        <input
                                          type="text"
                                          value={ex1Inputs[nounKey][idx].plur}
                                          onChange={(e) => handleEx1Change(nounKey, idx, 'plur', e.target.value)}

                                        />
                                        {ex1Checked && !plurOk && <div className="text-[11px] font-semibold text-rose-700 mt-0.5">Corretto: <span className="underline">{row.plur}</span></div>}

                                    </tr>
                                  );

                            {tok.punctuationAfter && <span className="font-serif text-2xl font-bold text-stone-800 pb-1.5 pl-0.5">{tok.punctuationAfter}</span>}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  {ex5Checked && (
                    <div className="mt-6 rounded-xl bg-emerald-50/80 border border-emerald-300 p-4 sm:p-5">
                      <div className="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-1.5">Traduzione di riferimento</div>
                      <p className="font-serif text-base sm:text-lg font-bold text-emerald-950 leading-relaxed">{EX5_DATA.traduzioneModello}</p>
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* ESERCIZIO 6 */}
            {activeTab === 'ex6' && (
              <section className="space-y-6">
                <div className="bg-white rounded-2xl shadow-sm border border-stone-200 p-5 sm:p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-stone-100 pb-4">
                    <div>
                      <span className="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#8B2635] bg-[#8B2635]/10 px-2.5 py-1 rounded-md">Esercizio 6</span>
                      <h2 className="text-xl sm:text-2xl font-serif font-bold text-stone-900 mt-1.5">I tre fenomeni fonetici dei verbi composti</h2>
                    </div>
                    <div className="flex flex-wrap items-center gap-2 shrink-0">
                      <button onClick={() => setEx6Checked(true)} className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-[#8B2635] hover:bg-[#741F2B] text-white text-sm font-semibold shadow-sm transition">
                        <Icon name="check-circle-2" className="w-4 h-4" /> Verifica
                      </button>
                      <button onClick={resetEx6} className="inline-flex items-center gap-1.5 px-3 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 text-sm font-medium transition">
                        <Icon name="rotate-ccw" className="w-4 h-4" /> Azzera
                      </button>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mt-6">
                    {EX6_DATA.map((item) => {
                      const { fenOk, prefOk, baseOk, compOk } = checkEx6Item(item);
                      const val = ex6Inputs[item.id];
                      return (
                        <div key={item.id} className="rounded-xl border border-stone-200 bg-[#FAF8F5] p-4 flex flex-col justify-between space-y-4">
                          <div className="space-y-3">
                            <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-[#8B2635] text-white text-xs font-bold">{item.numero}</span>
                            <div>
                              <label className="block text-xs font-semibold text-stone-600 mb-1">Nome del fenomeno fonetico</label>
                              <input
                                type="text"
                                value={val.fenomeno}
                                onChange={(e) => setEx6Inputs((prev) => ({ ...prev, [item.id]: { ...prev[item.id], fenomeno: e.target.value } }))}
                                className={`w-full px-3 py-2 rounded-lg border text-sm font-semibold bg-white outline-none ${!ex6Checked ? 'border-stone-300' : fenOk ? 'border-emerald-500 bg-emerald-50/70' : 'border-rose-400 bg-rose-50/70'}`}
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-stone-600 mb-1">Esempio (prefisso + verbo base → composto)</label>
                              <div className="flex items-center gap-1.5">
                                <input type="text" value={val.prefisso} onChange={(e) => setEx6Inputs((prev) => ({ ...prev, [item.id]: { ...prev[item.id], prefisso: e.target.value } }))} className={`w-1/4 px-2 py-1.5 rounded-lg border text-xs font-serif font-bold text-center bg-white ${!ex6Checked ? 'border-stone-300' : prefOk ? 'border-emerald-500 bg-emerald-50' : 'border-rose-400 bg-rose-50'}`} />
                                <span className="text-stone-500 font-bold">+</span>
                                <input type="text" value={val.verboBase} onChange={(e) => setEx6Inputs((prev) => ({ ...prev, [item.id]: { ...prev[item.id], verboBase: e.target.value } }))} className={`w-1/3 px-2 py-1.5 rounded-lg border text-xs font-serif font-bold text-center bg-white ${!ex6Checked ? 'border-stone-300' : baseOk ? 'border-emerald-500 bg-emerald-50' : 'border-rose-400 bg-rose-50'}`} />
                                <span className="text-stone-500 font-bold">→</span>
                                <input type="text" value={val.composto} onChange={(e) => setEx6Inputs((prev) => ({ ...prev, [item.id]: { ...prev[item.id], composto: e.target.value } }))} className={`w-5/12 px-2 py-1.5 rounded-lg border text-xs font-serif font-bold text-center bg-white ${!ex6Checked ? 'border-stone-300' : compOk ? 'border-emerald-500 bg-emerald-50' : 'border-rose-400 bg-rose-50'}`} />
                              </div>
                            </div>
                          </div>
                          {ex6Checked && (
                            <div className="rounded-lg bg-amber-50 border border-amber-200 p-3 text-xs text-stone-800">
                              <div className="font-bold text-[#8B2635]">{item.numero}. {item.fenomeno}</div>
                              <div className="font-serif font-bold text-sm mt-0.5">{item.esempioCompleto}</div>
                              <p className="text-stone-600 mt-1">{item.spiegazione}</p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </section>
            )}

            {/* PULSANTI NAVIGAZIONE E CONSEGNA */}
            <div className="mt-6 flex flex-wrap items-center justify-between gap-3">
              <button
                onClick={goPrevTab}
                disabled={currentTabIndex <= 0}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-white border border-stone-200 text-sm font-medium text-stone-700 hover:bg-stone-50 disabled:opacity-40"
              >
                <Icon name="chevron-left" className="w-4 h-4" /> Scheda precedente
              </button>

              {currentTabIndex < TABS.length - 1 ? (
                <button
                  onClick={goNextTab}
                  className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-[#8B2635] text-white text-sm font-medium hover:bg-[#741F2B]"
                >
                  Scheda successiva <Icon name="chevron-right" className="w-4 h-4" />
                </button>
              ) : (
                !submittedSuccess && (
                  <button
                    onClick={handleFinalSubmit}
                    disabled={isSubmitting}
                    className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-sm transition"
                  >
                    <Icon name="send" className="w-4 h-4" />
                    <span>{isSubmitting ? 'Invio...' : 'Consegna e invia punteggio'}</span>
                  </button>
                )
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
